[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Universal AI Platform"
readme = "../README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "pandas>=2.2.1",
    "pdfplumber>=0.11.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "plotly>=5.22.0",
    "kaleido>=0.2.1",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
