name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio pytest-cov ruff

    - name: Lint with Ruff
      run: ruff check backend/

    - name: Run tests
      # Ollama is not available in CI; tests are expected to mock the
      # Ollama / LLM clients.
      run: pytest backend/tests --cov=backend/app --cov-report=xml

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      # No package-lock.json is committed, so use `npm install` (not `npm ci`).
      working-directory: frontend
      run: npm install

    - name: Build
      working-directory: frontend
      run: npm run build
