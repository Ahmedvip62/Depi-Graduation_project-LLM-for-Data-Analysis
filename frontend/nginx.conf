# nginx config for the production frontend image.
# - Serves the built SPA (/usr/share/nginx/html) with history routing.
# - Reverse-proxies /api/ -> backend:8000, STRIPPING the /api prefix
#   (the FastAPI backend serves all routes at ROOT, no /api prefix).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: always serve index.html so client-side routes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy. The trailing slash on proxy_pass strips the
    # matched "/api/" prefix, so /api/upload -> http://backend:8000/upload.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (the /chat endpoint streams). Disable buffering
        # and allow long-lived connections so tokens stream through.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}